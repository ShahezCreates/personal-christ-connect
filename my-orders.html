<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders · Christ Connect</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="deluxe.css"></head><body class="private-body"><header class="private-nav glass"><a class="brand" href="dashboard.html"><span class="brand-mark">C</span><span>CHRIST<br><b>CONNECT</b></span></a><div class="actions"><a href="canteen.html">Pre-order</a><a href="profile.html">Profile</a><button id="logout">Sign out</button></div></header><main class="canteen-wrap"><section class="lf-hero reveal"><p class="eyebrow">PRIVATE · DINING HISTORY</p><h1>Your receipts<br><em>stay here.</em></h1><p>Every prepaid preorder is attached to your student account and has an on-site receipt code.</p></section><div id="orders" class="history-grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script><script src="deluxe.js"></script><script>(async()=>{const s=await CC_AUTH.requireAuth();if(!s)return;const c=await CC_AUTH.init(),{data,error}=await c.from('canteen_orders').select('order_code,receipt_code,total,status,pickup_date,pickup_slot,created_at,cancellable_until,canteen_outlets(name)').eq('student_id',s.user.id).order('created_at',{ascending:false});const e=v=>String(v??'').replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));document.querySelector('#orders').innerHTML=error?`<div class="student-card">${e(error.message)}</div>`:(data||[]).length?data.map(x=>`<article class="history-card"><b>${e(x.order_code||'Order')}</b><p>${e(x.canteen_outlets?.name||'Outlet')} · ₹${Number(x.total).toFixed(2)}</p><small>Receipt ${e(x.receipt_code||'—')}</small><br><small>${e(x.pickup_date||'')} · ${e(x.pickup_slot||'')} · ${e(x.status)}</small></article>`).join(''):'<div class="student-card"><p class="muted">No orders yet.</p></div>';document.querySelector('#logout').onclick=()=>CC_AUTH.signOut()})();</script></body></html>
