<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registration Form · Christ Connect</title>
<style>
body{font-family:Arial,sans-serif;background-color:#f2f2f2;margin:0;padding:25px}.container{width:min(450px,calc(100% - 50px));margin:25px auto;padding:25px;background:#fff;border:1px solid #ccc}.back{display:block;width:min(500px,calc(100% - 50px));margin:0 auto;color:#182b38}h2{text-align:center}.row{margin-bottom:15px}label{display:inline-block;width:120px}input[type=text],input[type=email],input[type=number],input[type=password],select{width:250px;max-width:calc(100% - 130px);padding:7px}.gender{margin-left:0}.error{color:red;display:block;margin-left:125px;margin-top:5px}.buttons{text-align:center;margin-top:20px}input[type=button],input[type=reset]{padding:8px 20px;margin:5px}.success{display:block;text-align:center;color:#28704a;margin-top:12px}
</style>
<script>
function validateForm(){const fields=['name','email','phone','course','password'];let valid=true;const message='This field is required, Please enter the value.';fields.forEach(id=>{const value=document.getElementById(id).value.trim();document.getElementById(id+'Error').innerHTML=value?'':message;if(!value)valid=false});const gender=document.getElementById('male').checked||document.getElementById('female').checked;document.getElementById('genderError').innerHTML=gender?'':message;if(!gender)valid=false;document.getElementById('success').innerHTML=valid?'Form validated. Connect this form to the secure student-registration API before collecting any real data.':''}
function resetForm(){['name','email','phone','gender','course','password'].forEach(id=>document.getElementById(id+'Error').innerHTML='');document.getElementById('success').innerHTML=''}
</script></head><body>
<a class="back" href="index.html">← Back to Christ Connect</a><div class="container"><h2>Registration Form</h2><form><div class="row"><label>Candidate Name:</label><input type="text" id="name"><span class="error" id="nameError"></span></div><div class="row"><label>Email-id:</label><input type="email" id="email"><span class="error" id="emailError"></span></div><div class="row"><label>Phone No:</label><input type="number" id="phone"><span class="error" id="phoneError"></span></div><div class="row"><label>Gender:</label><input type="radio" id="male" name="gender" class="gender"> Male <input type="radio" id="female" name="gender" class="gender"> Female <span class="error" id="genderError"></span></div><div class="row"><label>Course:</label><select id="course"><option value="">Select Course</option><option value="BCA">BCA</option><option value="BBA">BBA</option><option value="B.Tech">B.Tech</option><option value="MCA">MCA</option></select><span class="error" id="courseError"></span></div><div class="row"><label>Password:</label><input type="password" id="password"><span class="error" id="passwordError"></span></div><div class="buttons"><input type="button" value="Submit" onclick="validateForm()"><input type="reset" value="Reset" onclick="resetForm()"></div><span class="success" id="success"></span></form></div></body></html>
