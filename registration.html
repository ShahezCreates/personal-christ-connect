<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Form · Christ Connect</title><style>:root{--ink:#182b38;--muted:#718087;--paper:#f8f7f2;--line:#e5e7e1;--coral:#e96447;--dark:#1b303d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,rgba(207,224,174,.45),transparent 28%),var(--paper);color:var(--ink);font-family:"DM Sans",Arial,sans-serif;padding:28px}.page{width:min(860px,100%);margin:auto}.back{display:inline-block;color:var(--ink);font-weight:700;text-decoration:none;font-size:12px;margin-bottom:18px}.container{max-width:640px;margin:0 auto;padding:30px;border:1px solid rgba(24,43,56,.08);border-radius:24px;background:rgba(255,255,255,.7);backdrop-filter:blur(16px);box-shadow:16px 18px 38px rgba(24,43,56,.1),-10px -10px 26px rgba(255,255,255,.9)}h2{font:600 37px "Playfair Display",Georgia,serif;margin:0 0 7px}p.sub{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 28px}.row{display:grid;grid-template-columns:150px 1fr;gap:13px;align-items:center;margin-bottom:14px}.row label{font-size:10px;font-weight:800;letter-spacing:.7px}.row input,.row select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fafbf8}.gender-wrap{display:flex;gap:12px;font-size:12px;align-items:center}.gender-wrap input{width:auto}.error{color:#b84f3d;font-size:10px;grid-column:2}.buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.buttons input{border:1px solid var(--line);border-radius:12px;padding:11px 15px;cursor:pointer}.buttons input[type=button]{background:var(--dark);color:#fff}.success{display:block;text-align:center;color:#28704a;margin-top:14px;font-size:11px}@media(max-width:600px){body{padding:15px}.row{grid-template-columns:1fr}.error{grid-column:auto}.container{padding:22px}}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"><script>function validateForm(){const fields=['name','email','phone','course','password'];let valid=true;const message='This field is required, Please enter the value.';fields.forEach(id=>{const value=document.getElementById(id).value.trim();document.getElementById(id+'Error').innerHTML=value?'':message;if(!value)valid=false});const gender=document.getElementById('male').checked||document.getElementById('female').checked;document.getElementById('genderError').innerHTML=gender?'':message;if(!gender)valid=false;document.getElementById('success').innerHTML=valid?'Form validated. Connect this form to the secure student-registration API before collecting any real data.':''}function resetForm(){['name','email','phone','gender','course','password'].forEach(id=>document.getElementById(id+'Error').innerHTML='');document.getElementById('success').innerHTML=''}</script></head><body><div class="page"><a class="back" href="index.html">← Back to Christ Connect</a><div class="container"><p class="eyebrow">STUDENT ONBOARDING</p><h2>Join <span style="color:var(--coral)">Christ Connect.</span></h2><p class="sub">This keeps the original registration-flow feature while avoiding collection of real student records until an approved provisioning workflow is available.</p><form onsubmit="return false"><div class="row"><label>Candidate name</label><div><input type="text" id="name"><span class="error" id="nameError"></span></div></div><div class="row"><label>Email</label><div><input type="email" id="email"><span class="error" id="emailError"></span></div></div><div class="row"><label>Phone</label><div><input type="number" id="phone"><span class="error" id="phoneError"></span></div></div><div class="row"><label>Gender</label><div class="gender-wrap"><label><input type="radio" id="male" name="gender"> Male</label><label><input type="radio" id="female" name="gender"> Female</label><span class="error" id="genderError"></span></div></div><div class="row"><label>Course</label><div><select id="course"><option value="">Select Course</option><option value="BCA">BCA</option><option value="BBA">BBA</option><option value="B.Tech">B.Tech</option><option value="MCA">MCA</option></select><span class="error" id="courseError"></span></div></div><div class="row"><label>Password</label><div><input type="password" id="password"><span class="error" id="passwordError"></span></div></div><div class="buttons"><input type="reset" value="Reset" onclick="resetForm()"><input type="button" value="Validate" onclick="validateForm()"></div><span class="success" id="success"></span></form></div></div></body></html>
